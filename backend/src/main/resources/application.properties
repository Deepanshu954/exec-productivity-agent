server.port=8080

# Database configuration (Defaults to in-memory H2 with PostgreSQL compatibility, override with SPRING_DATASOURCE_* for Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:execagentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# AI Service Configuration
# Set AI_API_KEY (or GEMINI_API_KEY or OPENAI_API_KEY) to enable live LLM reasoning
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}
ai.api.provider=${AI_PROVIDER:auto}
ai.model=${AI_MODEL:gemini-1.5-flash}
